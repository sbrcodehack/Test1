<!DOCTYPE html>
<html>
<head>
  <title>Gold Price India</title>
</head>
<body style="background:#111;color:white;text-align:center;font-family:Arial">

<h2>Gold Price (India)</h2>

<div>Current Price</div>
<div id="current">Loading...</div>

<div>Yesterday Close</div>
<div id="yesterday">Loading...</div>

<div id="change"></div>

<script>
async function loadGold() {

  const proxy = "https://api.allorigins.win/raw?url=";

  const yahooUrl =
    "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?range=2d&interval=1d";

  try {

    const res = await fetch(proxy + encodeURIComponent(yahooUrl));
    const data = await res.json();

    const prices =
      data.chart.result[0].indicators.quote[0].close;

    const yesterdayUSD = prices[0];
    const todayUSD = prices[1];

    const usdToInr = 83;
    const ounceToGram = 31.1035;

    const today =
      (todayUSD * usdToInr) / ounceToGram;

    const yesterday =
      (yesterdayUSD * usdToInr) / ounceToGram;

    const diff = today - yesterday;
    const percent = (diff / yesterday) * 100;

    document.getElementById("current").innerHTML =
      "₹ " + today.toFixed(2) + " / gram";

    document.getElementById("yesterday").innerHTML =
      "₹ " + yesterday.toFixed(2) + " / gram";

    document.getElementById("change").innerHTML =
      (diff >= 0 ? "▲ " : "▼ ") +
      diff.toFixed(2) +
      " (" + percent.toFixed(2) + "%)";

  } catch (e) {
    document.getElementById("current").innerText =
      "Still blocked 😅";
    console.log(e);
  }
}

loadGold();
</script>

</body>
</html>

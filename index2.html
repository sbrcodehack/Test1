<!DOCTYPE html>
<html>
<head>
  <title>Gold Price India</title>
</head>
<body style="background:#111;color:white;text-align:center;font-family:Arial">

<h2>Gold Price (India)</h2>

<div>Current Price</div>
<div id="current">Loading...</div>

<div>Yesterday Close</div>
<div id="yesterday">Loading...</div>

<div id="change"></div>

<script>
async function loadGold() {

  const proxy = "https://api.allorigins.win/raw?url=";
  const url = "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?range=3d&interval=1d";

  try {
    const res = await fetch(proxy + encodeURIComponent(url));
    const data = await res.json();

    const closes =
      data.chart.result[0].indicators.quote[0].close;

    // 🔥 Filter valid prices only
    const validPrices = closes.filter(x => x !== null);

    if (validPrices.length < 2) {
      throw "Not enough data";
    }

    const yesterdayUSD = validPrices[validPrices.length - 2];
    const todayUSD = validPrices[validPrices.length - 1];

    const usdToInr = 83;
    const ounceToGram = 31.1035;

    const today = (todayUSD * usdToInr) / ounceToGram;
    const yesterday = (yesterdayUSD * usdToInr) / ounceToGram;

    const diff = today - yesterday;
    const percent = (diff / yesterday) * 100;

    document.getElementById("current").innerHTML =
      "₹ " + today.toFixed(2) + " / gram";

    document.getElementById("yesterday").innerHTML =
      "₹ " + yesterday.toFixed(2) + " / gram";

    const changeEl = document.getElementById("change");

    changeEl.innerHTML =
      (diff >= 0 ? "▲ " : "▼ ") +
      diff.toFixed(2) +
      " (" + percent.toFixed(2) + "%)";

    changeEl.style.color =
      diff >= 0 ? "#00ff99" : "#ff4d4d";

  } catch (e) {
    document.getElementById("current").innerText =
      "Data unavailable";
    console.log(e);
  }
}

loadGold();
</script>

</body>
</html>

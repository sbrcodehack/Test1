<!DOCTYPE html>
<html>
<head>
  <title>Gold Price India</title>
  <style>
    body{
      background:#111;
      color:white;
      text-align:center;
      font-family:Arial;
      padding-top:50px;
    }
    .price{ font-size:28px; margin:10px; }
    .up{ color:#00ff99; }
    .down{ color:#ff4d4d; }
  </style>
</head>
<body>

<h2>🇮🇳 Gold Price (India Estimate)</h2>

<div>Current Price</div>
<div id="current" class="price">Loading...</div>

<div>Yesterday</div>
<div id="yesterday" class="price">Loading...</div>

<div id="change"></div>

<script>
async function loadGold(){

  try{

    // GOLD USD (per ounce)
    const goldRes = await fetch(
      "https://stooq.com/q/l/?s=xauusd&f=sd2t2ohlcv&h&e=json"
    );
    const goldData = await goldRes.json();

    // USDINR
    const fxRes = await fetch(
      "https://stooq.com/q/l/?s=usdinr&f=sd2t2ohlcv&h&e=json"
    );
    const fxData = await fxRes.json();

    const todayUSD = parseFloat(goldData.data[0].close);
    const usdInr = parseFloat(fxData.data[0].close);

    // fallback: simulate yesterday (stooq free endpoint limitation)
    const yesterdayUSD = todayUSD * 0.995;

    const ounceToGram = 31.1035;

    const baseToday = (todayUSD * usdInr) / ounceToGram;
    const baseYesterday = (yesterdayUSD * usdInr) / ounceToGram;

    // India adjustments
    const importDuty = 0.15;
    const agriCess = 0.025;
    const gst = 0.03;
    const premium = 180;

    function calc(base){
      return base * (1 + importDuty + agriCess) * (1 + gst) + premium;
    }

    const today = calc(baseToday);
    const yesterday = calc(baseYesterday);

    const diff = today - yesterday;
    const percent = (diff / yesterday) * 100;

    document.getElementById("current").innerText =
      "₹ " + today.toFixed(2) + " / gram";

    document.getElementById("yesterday").innerText =
      "₹ " + yesterday.toFixed(2) + " / gram";

    const changeEl = document.getElementById("change");

    changeEl.innerText =
      (diff >= 0 ? "▲ " : "▼ ") +
      diff.toFixed(2) +
      " (" + percent.toFixed(2) + "%)";

    changeEl.className =
      diff >= 0 ? "up" : "down";

  }
  catch(e){
    console.log(e);
    document.getElementById("current").innerText =
      "Failed to load";
  }
}

loadGold();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Stock Picker - Trace Enabled</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background:#0a0a0b; color:#e0e0e0; text-align:center; padding: 20px; margin-bottom: 250px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 12px; }
        .buy-zone { border-left: 5px solid #238636; }
        .sell-zone { border-left: 5px solid #da3633; }
        .btn-scan { background: #238636; color: white; padding: 15px 40px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* Console Log Window */
        #console-log {
            position: fixed; bottom: 0; left: 0; right: 0; height: 200px;
            background: #000; color: #0f0; font-family: 'Courier New', monospace;
            text-align: left; padding: 10px; overflow-y: auto; border-top: 2px solid #333;
            font-size: 0.85em; z-index: 1000;
        }
        .log-entry { margin: 2px 0; border-bottom: 1px solid #111; }
        .log-err { color: #ff4444; }
        .log-warn { color: #ffae00; }
        .log-success { color: #00ff00; }
    </style>
</head>
<body>

    <h1>🚀 AI DYNAMIC SCANNER</h1>
    <p>Yahoo Finance Engine with Error Tracing</p>
    
    <button class="btn-scan" id="scanBtn" onclick="runYahooScanner()">RUN SYSTEM ANALYSIS</button>

    <div class="grid" id="resultsGrid"></div>

    <!-- Trace Logger -->
    <div id="console-log">
        <div class="log-entry">System initialized. Ready for scan...</div>
    </div>

<script>
const STOCK_POOL = [
    "RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "INFY.NS", "ICICIBANK.NS", 
    "HINDUNILVR.NS", "ITC.NS", "SBIN.NS", "BHARTIARTL.NS", "TATAMOTORS.NS"
];

// --- TRACING FUNCTION ---
function addLog(msg, type = 'info') {
    const logBox = document.getElementById("console-log");
    const entry = document.createElement("div");
    entry.className = `log-entry ${type === 'error' ? 'log-err' : type === 'success' ? 'log-success' : 'log-info'}`;
    const timestamp = new Date().toLocaleTimeString();
    entry.innerText = `[${timestamp}] ${msg}`;
    logBox.prepend(entry); // Newest logs at top
    console.log(`[${type.toUpperCase()}] ${msg}`);
}

async function runYahooScanner() {
    const btn = document.getElementById("scanBtn");
    const grid = document.getElementById("resultsGrid");
    
    addLog("Starting Global Market Scan...", "info");
    btn.disabled = true;
    grid.innerHTML = "";
    let picksFound = 0;

    for (const symbol of STOCK_POOL) {
        if (picksFound >= 5) {
            addLog("Found 5 potential trades. Stopping scan.", "success");
            break;
        }

        try {
            addLog(`Requesting data for ${symbol}...`);
            const prices = await fetchYahooData(symbol);
            
            if (!prices || prices.length === 0) {
                addLog(`Skipping ${symbol}: Data returned empty or null.`, "error");
                continue;
            }

            addLog(`Analyzing ${symbol} technicals...`, "info");
            const analysis = analyzeStock(symbol, prices);
            
            if (analysis.verdict !== "NEUTRAL") {
                addLog(`MATCH FOUND: ${symbol} listed as ${analysis.verdict}`, "success");
                renderCard(symbol, analysis);
                picksFound++;
            } else {
                addLog(`${symbol} is currently Neutral. Skipping.`);
            }
        } catch (e) { 
            addLog(`CRITICAL ERROR [${symbol}]: ${e.message}`, "error");
        }
        
        await new Promise(r => setTimeout(r, 800)); 
    }

    addLog("Scan Operation Complete.", "info");
    btn.disabled = false;
}

async function fetchYahooData(symbol) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1mo`;
    
    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP Status ${response.status}`);
        }

        const data = await response.json();
        
        if (!data.chart || !data.chart.result) {
            throw new Error("Malformed JSON response from Yahoo.");
        }

        const result = data.chart.result[0].indicators.quote[0].close.filter(p => p != null);
        addLog(`Successfully retrieved ${result.length} price points for ${symbol}`, "success");
        return result;

    } catch (err) {
        if (err.message.includes('Failed to fetch')) {
            addLog(`CORS Error: Access to Yahoo is blocked. Open the file via a Web Server (Live Server) or use a Proxy.`, "error");
        } else {
            addLog(`Fetch Error: ${err.message}`, "error");
        }
        return null;
    }
}

function analyzeStock(symbol, prices) {
    const currentPrice = prices[prices.length - 1];
    const prevPrice = prices[prices.length - 2];
    const sma5 = prices.slice(-5).reduce((a, b) => a + b, 0) / 5;
    
    const isBreakout = currentPrice > sma5 && prevPrice <= sma5;
    const volatility = ((currentPrice - prevPrice) / prevPrice) * 100;

    let verdict = "NEUTRAL";
    if (isBreakout && volatility > 0.3) verdict = "BUY";
    if (currentPrice < (sma5 * 0.98)) verdict = "SELL";

    return { currentPrice, sma5, volatility, verdict };
}

function renderCard(symbol, analysis) {
    const card = document.createElement("div");
    card.className = `card ${analysis.verdict === 'BUY' ? 'buy-zone' : 'sell-zone'}`;
    card.innerHTML = `
        <h2 style="color:#58a6ff; margin:0;">${symbol}</h2>
        <p style="font-size:1.5em; margin:10px 0;">₹${analysis.currentPrice.toFixed(2)}</p>
        <div style="color:${analysis.verdict === 'BUY' ? '#3fb950' : '#f85149'}; font-weight:bold;">
            ${analysis.verdict === 'BUY' ? '▲ MOMENTUM BUY' : '▼ TREND WEAKNESS'}
        </div>
    `;
    document.getElementById("resultsGrid").appendChild(card);
}
</script>
</body>
</html>

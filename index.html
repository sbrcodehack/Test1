<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI India Market Scanner</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background:#050505; color:#0f0; text-align:center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; transition: 0.3s; }
        .hot { border: 2px solid #0f0; box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }
        .btn-scan { background: #0f0; color: #000; padding: 15px 30px; border: none; font-size: 1.2em; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-scan:disabled { background: #444; cursor: not-allowed; }
        .loading { font-size: 1.2em; color: yellow; margin: 20px; }
        .signal-text { font-weight: bold; font-size: 1.1em; }
        .buy { color: #0f0; }
        .watch { color: #888; }
    </style>
</head>
<body>

    <h1>🚀 AI INTRADAY SCANNER</h1>
    <p>Targeting Nifty 50 & Budget Stocks for Tomorrow</p>
    
    <button class="btn-scan" id="scanBtn" onclick="runScanner()">START MARKET SCAN</button>
    <div id="loader" class="loading" style="display:none;">Scanning Market (Respecting API Limits)...</div>

    <div class="grid" id="resultsGrid">
        <!-- Stock Cards Appear Here -->
    </div>

<script>
const API_KEY = "QTBO0G73GXOPLCW3";
// Target List: Suzlon (Budget), IRFC (Budget), Tata Motors (Nifty), Zomato (Momentum), SBIN (Nifty)
const STOCKS = ["SUZLON.BSE", "IRFC.BSE", "TATAMOTORS.BSE", "ZOMATO.BSE", "SBIN.BSE"];

async function runScanner() {
    const btn = document.getElementById("scanBtn");
    const loader = document.getElementById("loader");
    const grid = document.getElementById("resultsGrid");
    
    btn.disabled = true;
    loader.style.display = "block";
    grid.innerHTML = "";

    for (let i = 0; i < STOCKS.length; i++) {
        const symbol = STOCKS[i];
        try {
            const data = await fetchStockData(symbol);
            renderCard(symbol, data);
        } catch (e) {
            console.error(e);
        }
        
        // Wait 15 seconds between stocks to stay within Free API limit (5 calls/min)
        if (i < STOCKS.length - 1) {
            loader.innerText = `Analyzing ${STOCKS[i+1]}... (Cooldown Active)`;
            await new Promise(r => setTimeout(r, 15000));
        }
    }

    loader.style.display = "none";
    btn.disabled = false;
    btn.innerText = "RESURVEY MARKET";
}

async function fetchStockData(symbol) {
    const url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${symbol}&apikey=${API_KEY}`;
    const res = await fetch(url);
    const json = await res.json();
    const series = json["Time Series (Daily)"];
    
    const dates = Object.keys(series).slice(0, 30);
    const prices = dates.map(d => parseFloat(series[d]["4. close"])).reverse();
    const volumes = dates.map(d => parseFloat(series[d]["5. volume"])).reverse();
    
    return { prices, volumes };
}

function renderCard(symbol, data) {
    const prices = data.prices;
    const currentPrice = prices[prices.length - 1];
    const ema9 = calculateEMA(prices, 9);
    const rsi = calculateRSI(prices);
    
    // Logic: Price > EMA9 and RSI is in "launch zone" (45-65)
    const isHot = (currentPrice > ema9 && rsi > 45 && rsi < 65);
    const signal = isHot ? "🔥 HIGH POTENTIAL" : "⏳ WATCHLIST";

    const card = document.createElement("div");
    card.className = `card ${isHot ? 'hot' : ''}`;
    card.innerHTML = `
        <h3>${symbol.split('.')[0]}</h3>
        <p>Price: <strong>₹${currentPrice.toFixed(2)}</strong></p>
        <p>RSI: ${rsi.toFixed(2)}</p>
        <p>EMA 9: ₹${ema9.toFixed(2)}</p>
        <hr style="border:0; border-top:1px solid #333">
        <div class="signal-text ${isHot ? 'buy' : 'watch'}">${signal}</div>
    `;
    document.getElementById("resultsGrid").appendChild(card);
}

// Indicator Math
function calculateEMA(data, period) {
    const k = 2 / (period + 1);
    let ema = data.slice(0, period).reduce((a, b) => a + b, 0) / period;
    for (let i = period; i < data.length; i++) { ema = data[i] * k + ema * (1 - k); }
    return ema;
}

function calculateRSI(prices) {
    let gains = 0, losses = 0;
    for (let i = prices.length - 14; i < prices.length; i++) {
        let diff = prices[i] - prices[i-1];
        if (diff > 0) gains += diff; else losses -= diff;
    }
    return 100 - (100 / (1 + (gains/Math.abs(losses))));
}
</script>
</body>
</html>
